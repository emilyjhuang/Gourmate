<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - Gourmate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="nav-container">
            <div class="logo">
                <a href="{{ url_for('findrests') }}">Gourmate</a>
            </div>
            <div class="nav-links">
                <a href="{{ url_for('findrests') }}">Find Restaurants</a>
                <a href="{{ url_for('my_restaurants') }}">My Saves</a>
                <a href="{{ url_for('been_to') }}">Been To</a>
                <!-- <a href="{{ url_for('recommendations') }}">For You</a>-->
                <a href="{{ url_for('profile') }}">My Profile</a>
                <a href="{{ url_for('account') }}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="page-content">
        <h2>Restaurant Recommendations</h2>

        <div class="results-layout">
            <div class="map-pane">
                <div id="map"></div>
            </div>
            <div class="list-pane" id="restaurant-list"></div>
        </div>
    </div>

    <script>
        let map;
        let restaurantMarkers = [];
        let restaurantData = [];

        document.addEventListener("DOMContentLoaded", function () {
            // Initialize map
            const midLat = {{ mid_lat }};
            const midLng = {{ mid_lng }};

            map = L.map('map').setView([midLat, midLng], 14);

            // Add tile layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            // Add location markers
            const locationA = {{ location1|tojson }};
            const locationB = {{ location2|tojson }};
            L.marker([locationA.lat, locationA.lng]).bindPopup("Starting Location").addTo(map);
            L.marker([locationB.lat, locationB.lng]).bindPopup("Destination Location").addTo(map);

            // Load restaurant data
            restaurantData = {{ restaurants|tojson|safe }};

            // Add markers, wiring hover -> focus the matching list card
            restaurantData.forEach((restaurant, i) => {
                const marker = L.marker([restaurant.lat, restaurant.lon])
                    .bindPopup(`<strong>${restaurant.name}</strong>`)
                    .addTo(map);

                marker.on('mouseover', () => focusRestaurant(i));
                marker.on('mouseout', clearFocus);

                restaurantMarkers.push({ marker });
            });

            renderList();

            // Auto-fit map to bounds
            const bounds = L.latLngBounds([
                [locationA.lat, locationA.lng],
                [locationB.lat, locationB.lng],
            ]);

            restaurantData.forEach(r => {
                if (r.lat && r.lon) bounds.extend([r.lat, r.lon]);
            });

            map.fitBounds(bounds, { padding: [50, 50] });
        });

        function renderList() {
            const list = document.getElementById("restaurant-list");

            if (restaurantData.length === 0) {
                list.innerHTML = `<p>No restaurants found. Try a wider radius or a different cuisine.</p>`;
                return;
            }

            list.innerHTML = restaurantData.map((restaurant, index) => {
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${restaurant.lat},${restaurant.lon}`;
                const websiteButton = restaurant.website
                    ? `<a href="${restaurant.website}" class="btn btn-primary" target="_blank">More Info</a>`
                    : '';

                return `
                    <div class="restaurant-card" data-index="${index}">
                        <h4>${restaurant.name}</h4>
                        <p><strong>Address:</strong> ${restaurant.address}</p>
                        <p><strong>Cuisine:</strong> ${restaurant.categories}</p>
                        ${websiteButton}
                        <button onclick="saveRestaurantDirect(${index})" class="btn btn-secondary">Save Restaurant</button>
                        <a href="${mapsUrl}" class="btn btn-info" target="_blank">Show on Google Map</a>
                    </div>
                `;
            }).join('');

            list.querySelectorAll('.restaurant-card').forEach(card => {
                const index = Number(card.dataset.index);
                card.addEventListener('mouseenter', () => focusRestaurant(index));
                card.addEventListener('mouseleave', clearFocus);
            });
        }

        function focusRestaurant(index) {
            restaurantMarkers.forEach((m, i) => {
                m.marker.setOpacity(i === index ? 1 : 0.35);
            });
            restaurantMarkers[index].marker.openPopup();

            document.querySelectorAll('.restaurant-card').forEach(card => {
                const isMatch = Number(card.dataset.index) === index;
                card.classList.toggle('focused', isMatch);
                card.classList.toggle('dimmed', !isMatch);
            });

            const card = document.querySelector(`.restaurant-card[data-index="${index}"]`);
            if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function clearFocus() {
            restaurantMarkers.forEach(m => m.marker.setOpacity(1));
            document.querySelectorAll('.restaurant-card').forEach(card => {
                card.classList.remove('focused', 'dimmed');
            });
        }

        function saveRestaurantDirect(index) {
            const restaurant = restaurantData[index];
            fetch('/save-restaurant', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(restaurant)
            })
            .then(response => response.json())
            .then(result => {
                alert(result.success ? "Restaurant saved!" : "Error: " + result.error);
            })
            .catch(() => alert("Something went wrong."));
        }
    </script>
    
        

    <style>

        html, body {
            overflow-y: auto;
            margin: 0;
            padding: 0;
        }

        .page-content {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 100px 24px 40px;
            box-sizing: border-box;
        }

        .page-content h2 {
            margin-bottom: 1.25rem;
        }

        .results-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .map-pane {
            flex: 1 1 50%;
            position: sticky;
            top: calc(var(--nav-height) + 20px);
            height: calc(100vh - var(--nav-height) - 40px);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(36, 32, 30, 0.08);
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .list-pane {
            flex: 1 1 50%;
            max-height: calc(100vh - var(--nav-height) - 40px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-right: 4px;
        }

        @media (max-width: 900px) {
            .results-layout {
                flex-direction: column;
            }

            .map-pane {
                position: static;
                width: 100%;
                height: 360px;
            }

            .list-pane {
                max-height: none;
                overflow-y: visible;
                width: 100%;
            }
        }

        .restaurant-card {
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            padding: 20px;
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 16px rgba(36, 32, 30, 0.1);
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
        }

        .restaurant-card:hover {
            transform: translateY(-2px);
        }

        .restaurant-card.focused {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-light);
        }

        .restaurant-card.dimmed {
            opacity: 0.5;
        }

        .restaurant-card h4 {
            margin: 0 0 10px 0;
            font-size: 20px;
            font-family: var(--font-heading);
            color: var(--color-ink);
        }

        .restaurant-card p {
            margin: 6px 0;
            font-size: 14px;
            color: var(--color-muted);
        }

        .btn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
            transition: opacity 0.15s ease;
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: white;
        }

        .btn-secondary {
            background-color: var(--color-ink);
            color: white;
        }

        .btn-info {
            background-color: var(--color-accent);
            color: var(--color-ink);
        }

        .btn:hover {
            opacity: 0.85;
        }
    </style>
</body>
</html>
