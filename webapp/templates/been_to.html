<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Been To - Gourmate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">
                <a href="{{ url_for('findrests') }}">Gourmate</a>
            </div>
            <div class="nav-links">
                <a href="{{ url_for('findrests') }}">Find Restaurants</a>
                <a href="{{ url_for('my_restaurants') }}">My Saves</a>
                <a href="{{ url_for('been_to') }}">Been To</a>
                <!-- <a href="{{ url_for('recommendations') }}">For You</a>-->
                <a href="{{ url_for('profile') }}">My Profile</a>
                <a href="{{ url_for('account') }}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="page-content">
    <h2>Restaurants You've Been To</h2>
    <div class="restaurant-grid">
        {% for rest in been_to %}
        <div class="restaurant-card">
            <h4>{{ rest.name }}</h4>
            <p><strong>Rating You Gave:</strong> {{ rest.user_rating }}</p>
        </div>
        {% endfor %}
    </div>
    </div>

    <style>
    body {
        display: block;
        margin: 0;
    }

    .page-content {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 100px 20px 60px;
        box-sizing: border-box;
    }

    .page-content h2 {
        margin-bottom: 1.5rem;
    }


    .restaurant-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
    }





    </style>

</body>
</html>
